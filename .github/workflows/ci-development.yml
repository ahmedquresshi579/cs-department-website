name: CI - Development

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: Create stylelint config
        run: |
          echo '{"extends":"stylelint-config-standard","rules":{"no-descending-specificity":null,"alpha-value-notation":"number","color-function-notation":"legacy","color-function-alias-notation":null,"declaration-block-single-line-max-declarations":null,"media-feature-range-notation":null}}' > .stylelintrc.json

      - name: Run HTMLHint on all pages
        run: htmlhint src/*.html

      - name: Run stylelint on CSS
        run: stylelint src/css/*.css

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: development
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cs-department-website:develop .

      - name: Verify image exists
        run: docker images cs-department-website